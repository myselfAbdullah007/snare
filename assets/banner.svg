<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="780" height="200" rx="16" fill="url(#bg)" stroke="#30363d"/>

  <!-- the snare: a loop that cinches, drawn in as if setting the trap -->
  <path d="M 60 150 C 60 70, 160 70, 160 120 C 160 160, 110 160, 110 130 C 110 112, 132 112, 132 128"
        fill="none" stroke="url(#wire)" stroke-width="3" stroke-linecap="round" stroke-dasharray="360" stroke-dashoffset="360">
    <animate attributeName="stroke-dashoffset" from="360" to="0" dur="1.6s" fill="freeze"/>
  </path>
  <circle cx="132" cy="128" r="4" fill="#f85149" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/>
  </circle>

  <text x="230" y="98" fill="#e6edf3" font-size="64" font-weight="bold" letter-spacing="1">snare</text>
  <text x="232" y="132" fill="#8b949e" font-size="19">reproduce before you fix</text>
  <text x="234" y="162" fill="#6e7681" font-size="14">a bug isn't understood until a test fails for it</text>
</svg>
