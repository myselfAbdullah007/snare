<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
  <!-- window -->
  <rect x="8" y="8" width="764" height="376" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <!-- title bar -->
  <rect x="8" y="8" width="764" height="40" rx="12" fill="#161b22"/>
  <rect x="8" y="36" width="764" height="12" fill="#161b22"/>
  <circle cx="32" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="28" r="6" fill="#febc2e"/>
  <circle cx="72" cy="28" r="6" fill="#27c93f"/>
  <text x="390" y="33" text-anchor="middle" fill="#6e7681" font-size="13">snare — reproduce before you fix</text>

  <!-- line 1: command -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.4s" fill="freeze"/>
    <text x="30" y="92"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> /snare</tspan></text>
  </g>
  <!-- line 2: input -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
    <text x="30" y="124"><tspan fill="#58a6ff">→</tspan><tspan fill="#8b949e"> pasted trace:  cart_total([{qty:-3},{qty:2}]) returned </tspan><tspan fill="#f85149">-200</tspan></text>
  </g>
  <!-- line 3: seam -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze"/>
    <text x="30" y="164"><tspan fill="#3fb950">✓</tspan><tspan fill="#e6edf3"> seam found</tspan><tspan fill="#6e7681">   cart.py:14  </tspan><tspan fill="#d2a8ff">cart_total()</tspan></text>
  </g>
  <!-- line 4: wrote test -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.4s" fill="freeze"/>
    <text x="30" y="196"><tspan fill="#58a6ff">✎</tspan><tspan fill="#e6edf3"> wrote</tspan><tspan fill="#8b949e">  tests/test_cart.py::</tspan><tspan fill="#e6edf3">test_negative_qty_underflow</tspan></text>
  </g>
  <!-- line 5: run -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.4s" fill="freeze"/>
    <text x="30" y="228"><tspan fill="#8b949e">▶ pytest -q</tspan></text>
  </g>
  <!-- line 6: RED -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.4s" fill="freeze"/>
    <text x="30" y="268"><tspan fill="#f85149" font-weight="bold">✗ RED</tspan><tspan fill="#8b949e">   AssertionError: negative qty underflowed the total: </tspan><tspan fill="#f85149">-200</tspan></text>
  </g>
  <!-- line 7: right reason -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.4s" fill="freeze"/>
    <text x="30" y="300"><tspan fill="#6e7681">↳ red for the </tspan><tspan fill="#e6edf3" font-style="italic">reported</tspan><tspan fill="#6e7681"> reason — same value, same symptom </tspan><tspan fill="#3fb950">✓</tspan></text>
  </g>
  <!-- line 8: stop -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.1s" dur="0.4s" fill="freeze"/>
    <text x="30" y="340"><tspan fill="#febc2e">⏹ stopped.</tspan><tspan fill="#8b949e"> the fix is yours — this test must turn green.</tspan></text>
  </g>
  <!-- blinking cursor -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite" begin="5.5s"/>
    <rect x="322" y="328" width="9" height="16" fill="#e6edf3"/>
  </g>
</svg>
