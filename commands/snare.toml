description = "Turn a pasted bug report / stack trace into one failing test that reproduces it, before any fix"
prompt = "Reproduce the bug described (or in the pasted stack trace/log) as ONE failing test, before fixing anything. Steps: (1) Read the evidence fully and trace from the top frame down to the line that is actually wrong; grep the failing function and its callers. (2) Find the lowest layer that still shows the failure. (3) Match the repo's existing test framework, directory, and naming — do not add a framework. (4) Write ONE test that arranges the reported state, acts, and asserts the CORRECT behavior so it fails now. Name it for the bug. (5) Run it and confirm it fails for the REPORTED reason, not an import error, typo, or wrong assertion — quote the actual failure output. Report as: Bug / Test / Red / Fix hint. Then STOP — do not edit the source to make it pass unless asked. If you cannot reproduce from the given info, name the exact missing fact instead of guessing."
