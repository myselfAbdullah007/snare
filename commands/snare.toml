description = "Turn a pasted bug report / stack trace into one failing test that reproduces it, before any fix"
prompt = """Reproduce the bug described (or in the pasted stack trace/log) as ONE failing test, before fixing anything.

Two rules, in order:
1. Assert the behavior that SHOULD happen, never the behavior observed. Writing the reported wrong value into the assertion (`assert total == -200`) produces a test that passes today and catches nothing. Assert the contract (`assert total >= 0`).
2. The test must fail for the REPORTED reason — not an import error, bad fixture, or typo.

Steps: (1) Read the evidence fully; trace from the top frame down to the line actually wrong, and grep the failing function's callers — the bug is often one level up. (2) Reproduce at the lowest layer that still shows the failure (pure function > HTTP round-trip > E2E). (3) Match the repo's existing framework, directory, and naming; never install or introduce a framework. (4) Write ONE test: arrange the reported state, act, assert the correct behavior. Name it for the bug. Touch no source and no existing tests. (5) Run that ONE test with the framework's narrowest invocation (`pytest f.py::name`, `vitest run f -t "name"`, `go test -run '^Name$'`, etc.) — not the whole suite. (6) Triage the output: same exception/value as reported = correct, hand off; test PASSED = repro is wrong, you likely asserted the observed value; ImportError/SyntaxError/collection or fixture error = the test is broken, fix the test; different exception or unrelated wrong value = wrong code path, re-trace. Every verdict but the first means fix the test, never the source.

Report as: Bug / Test / Red / Fix hint — quoting the real failure output. Then STOP; do not edit the source to make it pass unless asked. Handing over a green test is task failure. If you cannot reproduce from the given info, name the exact missing fact instead of guessing.
"""
